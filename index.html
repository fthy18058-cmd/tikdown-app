<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikDown Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='108' fill='%230f111a'/><path d='M256 160 V310 M190 254 L256 320 L322 254 M160 360 H352' stroke='%23fe2c55' stroke-width='32' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #16192b;
            --primary-pink: #fe2c55;
            --primary-cyan: #25f4ee;
            --text-color: #ffffff;
            --text-secondary: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(22, 25, 43, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .logo-title span {
            color: var(--primary-pink);
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .input-box {
            display: flex;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 15px;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px;
            font-size: 0.95rem;
            direction: ltr;
        }

        .btn-fetch {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink), #ff0050);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
            margin-bottom: 25px;
            transition: 0.2s;
        }

        .btn-fetch:active {
            transform: scale(0.98);
        }

        .result-card {
            display: none;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-direction: column;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-cyan);
        }

        .user-details h4 {
            font-size: 0.95rem;
        }

        .user-details p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .media-preview {
            width: 100%;
            max-height: 380px;
            border-radius: 12px;
            background: #000;
            object-fit: contain;
        }

        .btn-download {
            background: #17af9b;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            font-size: 0.95rem;
        }

        .btn-audio {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            color: var(--primary-cyan);
            margin-top: 5px;
            display: none;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--primary-pink);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <span>⚡ Pro</span> TikDown
        </div>
    </header>

    <div class="container">
        <div class="input-box">
            <input type="text" id="videoUrl" placeholder="ضع رابط فيديو التيك توك هنا..." />
        </div>

        <button class="btn-fetch" onclick="fetchMedia()">⚡ جلب الميديا</button>
        <div class="status-msg" id="statusMsg">جاري معالجة الفيديو والتحميل المباشر...</div>

        <div class="result-card" id="resultCard">
            <div class="user-info">
                <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                <div class="user-details">
                    <h4 id="username">@user</h4>
                    <p id="videoDesc">وصف الفيديو...</p>
                </div>
            </div>

            <video id="videoPreview" class="media-preview" controls></video>

            <button class="btn-download" onclick="triggerDirectDownload('video')">
                📥 تحميل الفيديو بدون علامة مائية
            </button>
            <button class="btn-audio" onclick="triggerDirectDownload('audio')">
                🎵 تحميل الصوت MP3
            </button>
        </div>
    </div>

    <nav>
        <a href="#" class="nav-item active">🏠<span>الرئيسية</span></a>
        <a href="#" class="nav-item">📦<span>المخزون</span></a>
        <a href="#" class="nav-item">⚙️<span>الإعدادات</span></a>
    </nav>

    <script>
        let currentVideoData = null;

        async function fetchMedia() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                alert('الرجاء كتابة أو لصق رابط الفيديو أولاً!');
                return;
            }

            statusMsg.style.display = 'block';
            statusMsg.innerText = 'جاري التحقق من الفيديو...';
            resultCard.style.display = 'none';

            try {
                // استخدام API مجاني ومعتمد لتحليل روابط تيك توك
                const apiRes = await fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(urlInput)}`);
                const data = await apiRes.json();

                if (data && data.video) {
                    currentVideoData = data;

                    // عرض التاصيل
                    document.getElementById('username').innerText = `@${data.author?.unique_id || 'tiktok_user'}`;
                    document.getElementById('videoDesc').innerText = data.title || '';
                    document.getElementById('userAvatar').src = data.author?.avatar || '';
                    
                    const videoElem = document.getElementById('videoPreview');
                    videoElem.src = data.video.noWatermark || data.video.watermark;

                    resultCard.style.display = 'flex';
                    statusMsg.style.display = 'none';
                } else {
                    throw new Error('لم يتم العثور على ميديا في هذا الرابط');
                }
            } catch (err) {
                alert('حدث خطأ أثناء جلب الفيديو. تأكد من صحة الرابط!');
                statusMsg.style.display = 'none';
            }
        }

        // كود التحميل المباشر لمنع ظهور رسالة Save As المزعجة
        async function triggerDirectDownload(type) {
            if (!currentVideoData) return;

            const statusMsg = document.getElementById('statusMsg');
            statusMsg.style.display = 'block';
            statusMsg.innerText = 'جاري التنزيل المباشر إلى ذاكرة الهاتف...';

            let targetUrl = '';
            let filename = '';

            if (type === 'video') {
                targetUrl = currentVideoData.video.noWatermark || currentVideoData.video.watermark;
                filename = `TikDown_${Date.now()}.mp4`;
            } else {
                targetUrl = currentVideoData.music.play_url;
                filename = `TikDown_Audio_${Date.now()}.mp3`;
            }

            try {
                // جلب الملف برمجياً كـ Blob لتجاوز نافذة WebView المزعجة
                const res = await fetch(targetUrl);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                    statusMsg.innerText = 'تم التنزيل بنجاح إلى مجلد Downloads!';
                }, 1000);

            } catch (error) {
                // حل بديل في حال وجود قيود CORS من السيرفر
                window.location.href = targetUrl;
                statusMsg.style.display = 'none';
            }
        }
    </script>
</body>
</html>
