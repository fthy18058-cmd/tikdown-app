<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikDown ULTRA</title>
    <!-- خط تجوال الاحترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080911;
            --bg-card: rgba(21, 25, 41, 0.7);
            --neon-pink: #ff0050;
            --neon-cyan: #00f2fe;
            --neon-purple: #7b2cbf;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 80, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(8, 9, 17, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(255, 0, 80, 0.5);
        }

        /* Main Container */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 18px;
        }

        /* Hero Text */
        .hero-text {
            text-align: center;
            margin-bottom: 24px;
        }

        .hero-text h1 {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(90deg, #fff, var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Input Card */
        .input-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .input-card:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .input-card input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 12px 14px;
            font-size: 0.95rem;
            direction: ltr;
        }

        .btn-paste {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            color: var(--neon-cyan);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-paste:active {
            transform: scale(0.95);
            background: rgba(0, 242, 254, 0.15);
        }

        /* Primary Action Button */
        .btn-main {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 80, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-main:active {
            transform: scale(0.98);
            box-shadow: 0 4px 15px rgba(255, 0, 80, 0.2);
        }

        /* Loader */
        .loader-box {
            display: none;
            text-align: center;
            padding: 30px 0;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--neon-pink);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-box p {
            font-size: 0.9rem;
            color: var(--neon-cyan);
            font-weight: 500;
        }

        /* Result Card */
        .result-card {
            display: none;
            margin-top: 24px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .author-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .avatar-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            object-fit: cover;
            box-shadow: 0 0 12px rgba(255, 0, 80, 0.4);
        }

        .author-info h3 {
            font-size: 1rem;
            font-weight: 800;
        }

        .author-info p {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .video-caption {
            font-size: 0.88rem;
            color: #e2e8f0;
            line-height: 1.4;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .preview-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .preview-wrapper video {
            width: 100%;
            max-height: 380px;
            display: block;
            object-fit: contain;
        }

        /* Download Options Grid */
        .dl-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-dl {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-dl-video {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .btn-dl-audio {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: #fff;
        }

        .btn-dl-cover {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .btn-dl:active {
            transform: scale(0.97);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Bottom Nav */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: rgba(8, 9, 17, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--neon-pink);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>TikDown</span>
            <span class="brand-badge">ULTRA v2.0</span>
        </div>
    </header>

    <div class="container">
        
        <div class="hero-text">
            <h1>تحميل فيديوهات تيك توك ⚡</h1>
            <p>بدون علامة مائية • بجودة عالية HD • وبضغطة واحدة</p>
        </div>

        <!-- Input Box -->
        <div class="input-card">
            <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا..." autocomplete="off">
            <button class="btn-paste" onclick="pasteFromClipboard()">📋 لصق</button>
        </div>

        <button class="btn-main" onclick="processTikTokUrl()">
            <span>🚀 جلب واستخراج الفيديو</span>
        </button>

        <!-- Loading Spinner -->
        <div class="loader-box" id="loaderBox">
            <div class="spinner"></div>
            <p id="loaderText">جاري فحص وتجهيز الفيديو...</p>
        </div>

        <!-- Result Box -->
        <div class="result-card" id="resultCard">
            
            <div class="author-bar">
                <img id="authorAvatar" class="avatar-img" src="" alt="avatar">
                <div class="author-info">
                    <h3 id="authorName">@username</h3>
                    <p id="authorNick">User Display Name</p>
                </div>
            </div>

            <p class="video-caption" id="videoCaption"></p>

            <div class="preview-wrapper">
                <video id="videoPreview" controls poster=""></video>
            </div>

            <div class="dl-grid">
                <button class="btn-dl btn-dl-video" id="btnDlVideo" onclick="downloadMedia('video')">
                    📥 تنزيل الفيديو بدون علامة مائية
                </button>
                <button class="btn-dl btn-dl-audio" id="btnDlAudio" onclick="downloadMedia('audio')">
                    🎵 تنزيل الصوت (MP3)
                </button>
                <button class="btn-dl btn-dl-cover" id="btnDlCover" onclick="downloadMedia('cover')">
                    🖼️ حفظ صورة الغلاف
                </button>
            </div>

        </div>

    </div>

    <!-- Bottom Navigation -->
    <nav>
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span>التحميلات</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>عن التطبيق</span>
        </a>
    </nav>

    <!-- Notification Toast -->
    <div class="toast" id="toastMsg">تم النسخ بنجاح!</div>

    <script>
        let videoDataCache = null;

        // إظهار التنبيهات السريعة
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // لصق الرابط تلقائياً من الحافظة
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('videoUrl').value = text;
                    showToast('تم لصق الرابط من الحافظة! 📋');
                } else {
                    showToast('الحافظة فارغة!');
                }
            } catch (err) {
                showToast('الرجاء كتابة أو لصق الرابط يدوياً');
            }
        }

        // جلب الفيديو والبيانات من السيرفر
        async function processTikTokUrl() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loaderBox');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                showToast('⚠️ يرجى أدخال رابط الفيديو أولاً!');
                return;
            }

            // إخفاء النتيجة الحالية وإظهار الـ Loader
            resultCard.style.display = 'none';
            loader.style.display = 'block';
            document.getElementById('loaderText').innerText = 'جاري استخراج بيانات الفيديو...';

            try {
                // استخدام API قوي وثابت جداً مع دعم كامل للروابط المختصرة
                const response = await fetch(`https://api.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                if (result && result.code === 0 && result.data) {
                    const data = result.data;
                    videoDataCache = data;

                    // تعبئة البيانات في الواجهة
                    document.getElementById('authorAvatar').src = data.author.avatar || '';
                    document.getElementById('authorName').innerText = `@${data.author.unique_id}`;
                    document.getElementById('authorNick').innerText = data.author.nickname || '';
                    document.getElementById('videoCaption').innerText = data.title || 'فيديو تيك توك بدون عنوان';

                    const videoPlayer = document.getElementById('videoPreview');
                    videoPlayer.src = data.play;
                    videoPlayer.poster = data.cover;

                    // إظهار بطاقة النتيجة
                    loader.style.display = 'none';
                    resultCard.style.display = 'block';
                    showToast('تم جلب الفيديو بنجاح! 🎉');
                } else {
                    throw new Error('الرابط غير صحيح أو غير متوفر');
                }
            } catch (err) {
                loader.style.display = 'none';
                showToast('❌ حدث خطأ! تأكد من صحة الرابط وحاول مجدداً');
            }
        }

        // آلية التحميل المباشر وتجنب رسائل المتصفح Muted/SaveAs
        async function downloadMedia(type) {
            if (!videoDataCache) return;

            let fileUrl = '';
            let fileName = '';

            if (type === 'video') {
                fileUrl = videoDataCache.play;
                fileName = `TikDown_${videoDataCache.id || Date.now()}.mp4`;
            } else if (type === 'audio') {
                fileUrl = videoDataCache.music;
                fileName = `TikDown_Audio_${Date.now()}.mp3`;
            } else if (type === 'cover') {
                fileUrl = videoDataCache.cover;
                fileName = `TikDown_Cover_${Date.now()}.jpg`;
            }

            showToast('⏳ جاري بدء التنزيل المباشر...');

            try {
                // تحويل الملف لـ Blob لتنزيله مباشرة على ذاكرة الهاتف
                const res = await fetch(fileUrl);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();

                setTimeout(() => {
                    URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(link);
                    showToast('✅ تم الحفظ بنجاح في الهاتف!');
                }, 1200);

            } catch (e) {
                // خيار بديل في حال قيود CORS التلقائية
                window.location.href = fileUrl;
            }
        }
    </script>
</body>
</html>
